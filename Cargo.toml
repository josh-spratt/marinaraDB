[package]
name = "marinaradb"
version = "0.1.0"
license = "MIT"
edition = "2021"

[[bin]]
name = "marinara"
path = "src/main.rs"

[lib]
name = "marinaradb"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rustyline = "14"
serde = { version = "1", features = ["derive"] }
bincode = "1"
thiserror = "1"
anyhow = "1"
crc32fast = "1"

[dev-dependencies]
tempfile = "3"
